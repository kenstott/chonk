name: Tests

# Runs the unit suite, including the PostgreSQL lane of the backend parity
# contract, on every push to main and every pull request. The release workflow
# repeats this gate before publishing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Python with spaCy wheels (spacy 3.8.14 has none for 3.14).
        python-version: ["3.11", "3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chonk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync environment
        run: uv sync --all-extras --group dev

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run tests
        env:
          CHONK_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/chonk_test
        run: uv run pytest tests/unit -q
